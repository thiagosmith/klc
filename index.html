 "git-clone"], "answer": [1]}, {"chapter": 9, "number": 3, "question": "Assuming that you are in a directory containing an unpacked source package, which command will install build dependencies listed in the Build-Depends field of the debian/control file?", "options": ["dpkg --build_dep", "apt build-dep ./", "dpkg-buildpackage", "dch --build-dep"], "answer": [1]}, {"chapter": 9, "number": 4, "question": "Which file or command will reveal whether or not your changes to a Debian package \"stuck\"?", "options": ["dch --updates", "debian/changelog", "DEBCHANGES", "dch --local"], "answer": [1]}, {"chapter": 9, "number": 5, "question": "When applying changes, which command will update the prefix used in a Debian package to \"kali\"?", "options": ["dch --local kali", "dch --prefix kali", "dpkg-update -p kali", "dpkg-buildpackage -u kali"], "answer": [1]}, {"chapter": 9, "number": 6, "question": "What is the proper command for copying the config file from a running Kali Linux instance to a downloaded Kali source tree in the current directory?", "options": ["cp /boot/config-4.9.0-kali1-amd64 ~/kernel/linux-source-4.9/.config", "cp /boot/kali-linux-4.9.0-kali1-amd64/ ~/kernel/linux-source-4.9/", "cp /boot/kali-linux-4.9.0-kali1-amd64/.config ~/kernel/linux-source-4.9/.config", "cp /boot/kali-linux-4.9.0-kali1-amd64/.config ~/kernel/linux-source-4.9/"], "answer": [0]}, {"chapter": 9, "number": 7, "question": "Which command will execute the graphical kernel configuration tool?", "options": ["make config", "make menuconfig", "make gconfig", "make textconfig"], "answer": [1]}, {"chapter": 9, "number": 8, "question": "Which command will install the prerequisites for the Kali Linux build environment?", "options": ["apt install livebuild", "apt install git livebuild", "apt install curl git livebuild", "apt install curl git live-build"], "answer": [3]}, {"chapter": 9, "number": 9, "question": "A user on a 32-bit operating system wishes to create a custom Kali Linux ISO image for the  10, "number": 3, "question": "Which of these commands will execute 'uptime; uname -a' on the kali-scratch minion?", "options": ["salt kali-scratch -x ’uptime; uname -a’", "salt kali-scratch cmd ’uptime; uname -a’", "salt kali-scratch --shell ’uptime; uname -a’", "salt kali-scratch cmd.shell ’uptime; uname -a’"], "answer": [3]}, {"chapter": 10, "number": 4, "question": "Which of the following commands will generate a binary package from and unsigned source package with unsigned .buildinfo and .changes file?", "options": ["dpkg --build -u", "dpkg-build -p -us -ub", "dpkg-buildpackage -us -uc", "dpkg-buildpackage -us -ub"], "answer": [2]}, {"chapter": 10, "number": 5, "question": "Which command is used to create and manage Debian repositories?", "options": ["debrepo", "reprepo", "pkgrepo", "deb_repo"], "answer": [1]}, {"chapter": 10, "number": 6, "question": "Select all of the fields required in a repo configuration file:", "options": ["Codename", "Architectures", "Components", "Status"], "answer": [0, 1, 2]}, {"chapter": 11, "number": 1, "question": "Which of the following are not a part of the \"CIA triad\"?", "options": ["Confidentiality", "Classification", "Integrity", "Accessibility", "Authentication", "Availability"], "answer": [1, 3, 4]}, {"chapter": 11, "number": 2, "question": "An organization owns a web server which generates revenue based on uptime. Which of the following security attributes of the system will be the primary focus of the organization?", "options": ["Accessibility", "Integrity", "Availability", "Confidentiality"], "answer": [2]}, {"chapter": 11, "number": 3, "question": "A flaw has been found in a cryptographic algorithm that weakens the cryptographic system. Which of the following elements of the CIA triad are affected by this?", "options": ["Confidentiality", "Authentication", "Accessibility", "Classification"], "answer": [0]}, {"chapter": 11, "number": 4, "question": "Which of the following best describes describe software that can be used to take advantage of a security weakness?", "options": ["vulnerability", "exploit", "patch", "race condition"], "answer": [1]}, {"chapter": 11, "number": 5, "question": "Which of the following (derived from likelihood of occurrence and impact) provides guidance to those responsible for securing and maintaining the systems in question?", "options": ["Overall Risk", "Compliance", "Adversarial Rating", "Deviation"], "answer": [0]}, {"chapter": 11, "number": 6, "question": "Which of the following leverages identified issues to uncover the worst-case scenario?", "options": ["Penetration Test", "Vulnerability Assessment", "Compliance Test", "Application Assessment?"], "answer": [0]}, {"chapter": 11, "number": 7, "question": "Which of the following best describes a technique that is used to target the various applications installed on the workstation of an employee within a target organization?", "options": ["Client-Side Attack", "Denial of Service", "Memory Corruption", "SQL Injection"], "answer": [0]}];
let lang="en", idx=0, answers=[], filtered=[];
const ui={
en:{sub:"Questions are displayed in English. Use the translation button for Portuguese.",translate:"🇧🇷 Translate to Portuguese",back:"🇺🇸 Show English",submit:"Check answer",next:"Next question",finish:"Finish test",restart:"Restart",correct:"Correct!",wrong:"Incorrect",why:"Why this is correct",whyWrong:"Why this option is not correct",right:"Correct answer",result:"Test result",correctN:"Correct",wrongN:"Wrong",accuracy:"Accuracy",error:"Error rate",review:"Review",choose:"Please select an answer."},
pt:{sub:"As perguntas são exibidas em inglês. Use o botão para alternar para português.",translate:"🇺🇸 Mostrar em inglês",back:"🇧🇷 Traduzir para português",submit:"Verificar resposta",next:"Próxima questão",finish:"Finalizar teste",restart:"Reiniciar",correct:"Correto!",wrong:"Incorreto",why:"Por que está correto",whyWrong:"Por que esta opção não está correta",right:"Resposta correta",result:"Resultado do teste",correctN:"Acertos",wrongN:"Erros",accuracy:"Aproveitamento",error:"Taxa de erro",review:"Revisão",choose:"Selecione uma resposta."}
};
const tr={}; // Lightweight bilingual rendering: original English plus Portuguese explanations generated from a local map.
const ptQ = {};
const ptOpt = {};
function key(q){return q.chapter+"-"+q.number}
function explanation(q){
  const a=q.answer.map(i=>displayText(q.options[i])).join(", ");
  const d=detailedExplanation(q);
  return {en:`The correct answer is: ${a}. ${d.en}`,pt:`A resposta correta é: ${a}. ${d.pt}`};
}
function render(){
 if(!filtered.length){document.getElementById("app").innerHTML="<p>No questions available.</p>";return}
 if(idx>=filtered.length){showResult();return}
 const q=filtered[idx], a=answers[idx];
 document.getElementById("bar").style.width=((idx)/filtered.length*100)+"%";
 let opts=q.options.map((o,i)=>{
  let cls="";
  if(a && a.checked){if(q.answer.includes(i))cls="correct"; else if(a.selected.includes(i))cls="incorrect"}
  const disabled=a&&a.checked?"disabled":"";
  const type=q.answer.length>1?"checkbox":"radio";
  const checked=a&&a.selected.includes(i)?"checked":"";
  return `<label class="option ${cls}"><input type="${type}" name="ans" value="${i}" ${checked} ${disabled}><span>${escape(o)}</span></label>`;
 }).join("");
 let feedback="";
 if(a&&a.checked){
   const ok=a.selected.length===q.answer.length&&a.selected.every(x=>q.answer.includes(x));
   const ex=explanation(q);
   const selectedText = a.selected.map(i=>displayText(q.options[i])).join(", ");
   const correctText = q.answer.map(i=>displayText(q.options[i])).join(", ");
   const detailed = detailedExplanation(q);
   const feedbackText = detailed[feedbackLang];
   feedback=`<div class="feedback ${ok?"ok":"bad"}"><h3>${ok?ui[lang].correct:ui[lang].wrong}</h3>
   ${ok
     ? `<b>${ui[lang].why}</b><div class="pt">${escape(feedbackText)}</div>`
     : `<b>${ui[lang].whyWrong}</b>
        <div class="pt"><strong>Selected option:</strong> ${escape(selectedText)}</div>
        <div class="pt">${escape(feedbackText)}</div>
        <br><b>${ui[lang].right}</b>
        <div class="pt">${escape(correctText)}</div>
        <div class="pt">${escape(feedbackText)}</div>`}
   <div style="margin-top:12px"><button onclick="toggleFeedbackLanguage()">${feedbackLang==="pt"?"🇺🇸 Show explanation in English":"🇧🇷 Mostrar explicação em português"}</button></div>
   </div>`;
 }
 document.getElementById("app").innerHTML=`<div class="meta">Chapter ${q.chapter} · Question ${q.number} · ${idx+1}/${filtered.length}</div>
 <h2 class="question">${escape(displayText(q.question))}</h2>${opts}${feedback}
 <div class="actions"><button onclick="prev()" ${idx===0?"disabled":""}>←</button>
 <button class="primary" onclick="${a&&a.checked?"next()":"check()"}">${a&&a.checked?(idx===filtered.length-1?ui[lang].finish:ui[lang].next):ui[lang].submit}</button></div>`;
}
function check(){
 const q=filtered[idx], inputs=[...document.querySelectorAll('input[name="ans"]:checked')];
 if(!inputs.length){alert(ui[lang].choose);return}
 answers[idx]={selected:inputs.map(x=>+x.value),checked:true}; render();
}
function next(){if(idx<filtered.length-1){idx++;render()}else showResult()}
function prev(){if(idx>0){idx--;render()}}
function toggleLang(){lang=lang==="en"?"pt":"en";document.getElementById("langBtn").textContent=ui[lang].translate;document.getElementById("subtitle").textContent=ui[lang].sub;render()}
function restart(){answers=[];idx=0;startChapter()}
function startChapter(){
 const v=document.getElementById("chapterFilter").value;
 filtered=v==="all"?BANK:BANK.filter(q=>q.chapter==v); answers=[];idx=0;render();
}
function showResult(){
 document.getElementById("bar").style.width="100%";
 let correct=0; answers.forEach((a,i)=>{if(a){const q=filtered[i];const ok=a.selected.length===q.answer.length&&a.selected.every(x=>q.answer.includes(x));if(ok)correct++}});
 const total=filtered.length, wrong=total-correct, acc=Math.round(correct/total*100), err=100-acc;
 document.getElementById("app").innerHTML=`<div class="result"><div class="meta">${ui[lang].result}</div><div class="score">${acc}%</div>
 <div class="stats"><div class="stat"><b>${correct}</b>${ui[lang].correctN}</div><div class="stat"><b>${wrong}</b>${ui[lang].wrongN}</div><div class="stat"><b>${err}%</b>${ui[lang].error}</div></div>
 <button class="primary" onclick="restart()">${ui[lang].restart}</button>
 <div class="review"><h3>${ui[lang].review}</h3>${filtered.map((q,i)=>{const a=answers[i]||{selected:[]};const ok=a.selected.length===q.answer.length&&a.selected.every(x=>q.answer.includes(x));return `<div class="review-item"><b>Q${i+1} — ${ok?"✓":"✗"}</b> <span class="small">${escape(displayText(q.question))}</span></div>`}).join("")}</div></div>`;
}
function escape(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
BANK.forEach(q=>{if(![...document.querySelectorAll("#chapterFilter option")].some(o=>o.value==q.chapter)){let o=document.createElement("option");o.value=q.chapter;o.textContent="Chapter "+q.chapter;document.getElementById("chapterFilter").appendChild(o)}})
startChapter();
</script>
</body>
